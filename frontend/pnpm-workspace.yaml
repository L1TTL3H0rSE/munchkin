packages:
  - applications/*
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true
  sharp: true

catalog:
  eslint-plugin-vue: 10.5.1
  vue-eslint-parser: 10.4.1
  vite: 8.2.1
  '@vitejs/plugin-vue': 6.0.8
  storybook: 10.5.8
  '@storybook/vue3-vite': 10.5.8
  '@storybook/addon-vitest': 10.5.8
  '@vitest/browser-playwright': 4.1.11
  playwright: 1.62.1
  ofetch: 1.5.1
  '@axe-core/playwright': 4.10.2
  '@playwright/test': 1.55.1
  typescript: ^6.0.3
  '@types/node': ^25.9.1
  nuxt: ^4.4.6
  vue: ^3.5.34
  zod: ^3.25.76
  vitest: 4.1.11
  eslint: ^9.39.4
  '@typescript-eslint/parser': ^8.65.0
  '@nuxt/eslint': ^1.3.0
  sass-embedded: ^1.92.0
  vue-tsc: ^3.2.4

ignoredOptionalDependencies:
