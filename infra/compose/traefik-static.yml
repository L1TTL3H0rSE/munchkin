global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: false
  insecure: false

ping:
  entryPoint: web

entryPoints:
  web:
    address: ":8080"
  websecure:
    address: ":8443"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  le:
    acme:
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  format: json
  level: INFO

accessLog:
  format: json
  bufferingSize: 100

metrics:
  prometheus: {}
