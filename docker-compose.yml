name: munchkin

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-munchkin}
      POSTGRES_USER: ${POSTGRES_USER:-munchkin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-munchkin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  game:
    build:
      context: .
      dockerfile: backend/game/Dockerfile
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-munchkin}:${POSTGRES_PASSWORD:-munchkin}@postgres:5432/${POSTGRES_DB:-munchkin}?sslmode=disable
      AUTO_MIGRATE: "true"
      GAME_CONTENT_PATH: /app/content/sets/demo/cards.json
      MIGRATION_PATH: /app/migrations/000001_game.up.sql
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${GAME_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:8080/healthz
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: ${PUBLIC_GAME_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      game:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
