name: munchkin-isolated-restore

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

services:
  postgres-restore:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${RESTORE_POSTGRES_DB:-munchkin_restore}
      POSTGRES_USER: ${RESTORE_POSTGRES_USER:-munchkin_restore}
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?RESTORE_POSTGRES_PASSWORD must be supplied by restore-postgres.sh}
    volumes:
      - type: bind
        source: ${RESTORE_WORK_DIR:-./.restore-work}
        target: /restore
    networks:
      - restore
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *bounded-logging

networks:
  restore:
    name: ${RESTORE_NETWORK_NAME:-munchkin-isolated-restore}
    internal: true
