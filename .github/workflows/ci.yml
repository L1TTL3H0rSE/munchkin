name: Munchkin CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified immutable image pair
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: munchkin-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LEINO_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  harness:
    name: Harness and repository policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Run repository gates
        run: |
          node --test --test-isolation=none .codex/hooks/test/*.test.mjs
          node --test tools/leinoctl/test/*.test.mjs
          node .codex/hooks/plan-lint.mjs
          ./leinoctl preflight
          ./scripts/ci-impact.sh

  content:
    name: Content validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Validate content
        run: |
          node --test content/tools/validate.test.mjs
          node content/tools/validate.mjs content/sets/demo/cards.json

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.25.12
          cache: true
      - name: Test backend
        working-directory: backend/game
        run: go test ./...

  backend-postgres:
    name: Backend PostgreSQL service contract
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: munchkin_test
          POSTGRES_USER: munchkin
          POSTGRES_PASSWORD: munchkin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U munchkin -d munchkin_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://munchkin:munchkin@127.0.0.1:5432/munchkin_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.25.12
          cache: true
      - name: Test PostgreSQL contract
        working-directory: backend/game
        run: go test ./internal/repository/postgres -run TestPostgresServiceContract -count=1

  frontend:
    name: Frontend lint, typecheck, tests and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.8.0 --activate
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend gates
        working-directory: frontend
        run: |
          pnpm lint
          pnpm check
          pnpm build

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate Compose configuration
        run: docker compose --parallel 8 -f docker-compose.yml config

  docker-smoke:
    name: Docker image build smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Build application images
        run: docker compose --parallel 8 -f docker-compose.yml build game web

  publish:
    name: Publish immutable Yandex image pair
    needs:
      - harness
      - content
      - backend-unit
      - backend-postgres
      - frontend
      - compose-config
      - docker-smoke
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-24.04
    environment: production-images
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      game_image: ${{ steps.publish-images.outputs.game_image }}
      web_image: ${{ steps.publish-images.outputs.web_image }}
    concurrency:
      group: munchkin-image-publication
      cancel-in-progress: false
    env:
      WIF_AUDIENCE: https://github.com/L1TTL3H0rSE
      WIF_EXPECTED_ISSUER: https://token.actions.githubusercontent.com
      WIF_EXPECTED_AUDIENCE: https://github.com/L1TTL3H0rSE
      WIF_EXPECTED_SUBJECT: repo:L1TTL3H0rSE@32160016/munchkin@1316069622:environment:production-images
      WIF_EXPECTED_REPOSITORY_ID: "1316069622"
      WIF_EXPECTED_REPOSITORY_OWNER_ID: "32160016"
      WIF_EXPECTED_ENVIRONMENT: production-images
      WIF_SERVICE_ACCOUNT_ID: ${{ vars.YANDEX_GITHUB_IMAGES_SERVICE_ACCOUNT_ID }}
      REGISTRY: cr.yandex/crpdnmjudj1usiu90gdn
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go for security tooling
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.25.12
          cache: false
      - name: Claim probe
        run: |
          chmod +x scripts/ci/yandex-wif-token.sh
          claims="$(scripts/ci/yandex-wif-token.sh claims)"
          printf '%s\n' "$claims"
          if grep -Eiq 'eyJ|(^|[^a-z])t1\.' <<< "$claims"; then
            echo 'claim evidence contained a token-like value' >&2
            exit 1
          fi
      - name: Exchange WIF token and log in to registry
        run: |
          access_token="$(scripts/ci/yandex-wif-token.sh exchange)"
          test -n "$access_token"
          printf '%s' "$access_token" | docker login cr.yandex --username iam --password-stdin
          unset access_token
      - name: Build, scan and publish immutable images
        id: publish-images
        env:
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: https://github.com/L1TTL3H0rSE/munchkin
          DOCKER_BUILDKIT: 1
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'github.sha is not a full lowercase commit SHA' >&2
            exit 1
          fi
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          game_ref="${REGISTRY}/game:${COMMIT_SHA}"
          web_ref="${REGISTRY}/web:${COMMIT_SHA}"
          for image_ref in "$game_ref" "$web_ref"; do
            if docker manifest inspect "$image_ref" >/dev/null 2>&1; then
              echo "immutable image tag already exists: $image_ref" >&2
              exit 1
            fi
          done
          docker build \
            --file backend/game/Dockerfile \
            --tag "$game_ref" \
            --build-arg "OCI_SOURCE=${SOURCE_REPOSITORY}" \
            --build-arg "OCI_REVISION=${COMMIT_SHA}" \
            --build-arg "OCI_CREATED=${created}" \
            --build-arg 'OCI_LICENSES=MIT' \
            .
          docker build \
            --file frontend/Dockerfile \
            --tag "$web_ref" \
            --build-arg "OCI_SOURCE=${SOURCE_REPOSITORY}" \
            --build-arg "OCI_REVISION=${COMMIT_SHA}" \
            --build-arg "OCI_CREATED=${created}" \
            --build-arg 'OCI_LICENSES=MIT' \
            .
          for image_ref in "$game_ref" "$web_ref"; do
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")"
            source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image_ref")"
            created_label="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.created" }}' "$image_ref")"
            licenses="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$image_ref")"
            [[ "$revision" == "$COMMIT_SHA" && "$source" == "$SOURCE_REPOSITORY" && "$created_label" == "$created" && "$licenses" == MIT ]]
          done
          chmod +x scripts/ci/security-scan.sh
          scripts/ci/security-scan.sh \
            --game-image "$game_ref" \
            --web-image "$web_ref" \
            --release-commit "$COMMIT_SHA"
          docker push "$game_ref"
          docker push "$web_ref"
          game_digest="$(docker manifest inspect --verbose "$game_ref" | jq -er 'if type == "array" then .[0].Descriptor.digest else .Descriptor.digest end')"
          web_digest="$(docker manifest inspect --verbose "$web_ref" | jq -er 'if type == "array" then .[0].Descriptor.digest else .Descriptor.digest end')"
          [[ "$game_digest" =~ ^sha256:[0-9a-f]{64}$ && "$web_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          security_evidence="release/security/security-evidence-${COMMIT_SHA}.json"
          jq --arg game "${REGISTRY}/game@${game_digest}" \
            --arg web "${REGISTRY}/web@${web_digest}" \
            '.images.game.image = $game | .images.web.image = $web' \
            "$security_evidence" >"${security_evidence}.tmp"
          mv -f "${security_evidence}.tmp" "$security_evidence"
          {
            printf 'game_digest=%s\n' "$game_digest"
            printf 'web_digest=%s\n' "$web_digest"
            printf 'game_image=%s\n' "${REGISTRY}/game@${game_digest}"
            printf 'web_image=%s\n' "${REGISTRY}/web@${web_digest}"
          } >>"$GITHUB_OUTPUT"
          mkdir -p release
          jq -n \
            --arg repository 'L1TTL3H0rSE/munchkin' \
            --arg commit "$COMMIT_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg created "$created" \
            --arg game_ref "$game_ref" \
            --arg game_digest "$game_digest" \
            --arg web_ref "$web_ref" \
            --arg web_digest "$web_digest" \
            '{schemaVersion: 1, repository: $repository, commit: $commit, workflowRunId: $run_id, workflowRunAttempt: $run_attempt, created: $created, images: {game: {ref: $game_ref, digest: $game_digest, image: ($game_ref + "@" + $game_digest)}, web: {ref: $web_ref, digest: $web_digest, image: ($web_ref + "@" + $web_digest)}}}' \
            > "release/munchkin-images-${COMMIT_SHA}.json"
      - name: Upload failed security scan diagnostics
        if: always() && steps.publish-images.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: munchkin-security-failure-${{ github.sha }}
          path: release/security
          if-no-files-found: warn
          retention-days: 14
      - name: Attest game provenance
        id: attest-game-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ env.REGISTRY }}/game
          subject-digest: ${{ steps.publish-images.outputs.game_digest }}
      - name: Attest web provenance
        id: attest-web-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ env.REGISTRY }}/web
          subject-digest: ${{ steps.publish-images.outputs.web_digest }}
      - name: Attest game SBOM
        id: attest-game-sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ env.REGISTRY }}/game
          subject-digest: ${{ steps.publish-images.outputs.game_digest }}
          sbom-path: release/security/game.sbom.spdx.json
      - name: Attest web SBOM
        id: attest-web-sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ env.REGISTRY }}/web
          subject-digest: ${{ steps.publish-images.outputs.web_digest }}
          sbom-path: release/security/web.sbom.spdx.json
      - name: Finalize attestation evidence
        env:
          GAME_PROVENANCE_BUNDLE: ${{ steps.attest-game-provenance.outputs.bundle-path }}
          WEB_PROVENANCE_BUNDLE: ${{ steps.attest-web-provenance.outputs.bundle-path }}
          GAME_SBOM_BUNDLE: ${{ steps.attest-game-sbom.outputs.bundle-path }}
          WEB_SBOM_BUNDLE: ${{ steps.attest-web-sbom.outputs.bundle-path }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for bundle in "$GAME_PROVENANCE_BUNDLE" "$WEB_PROVENANCE_BUNDLE" "$GAME_SBOM_BUNDLE" "$WEB_SBOM_BUNDLE"; do
            test -f "$bundle"
          done
          cp "$GAME_PROVENANCE_BUNDLE" "release/security/game-provenance.bundle.jsonl"
          cp "$WEB_PROVENANCE_BUNDLE" "release/security/web-provenance.bundle.jsonl"
          cp "$GAME_SBOM_BUNDLE" "release/security/game-sbom.bundle.jsonl"
          cp "$WEB_SBOM_BUNDLE" "release/security/web-sbom.bundle.jsonl"
          security_evidence="release/security/security-evidence-${COMMIT_SHA}.json"
          jq \
            --arg gameProvenance game-provenance.bundle.jsonl \
            --arg webProvenance web-provenance.bundle.jsonl \
            --arg gameSbom game-sbom.bundle.jsonl \
            --arg webSbom web-sbom.bundle.jsonl \
            '.attestations += {game:{provenanceBundle:$gameProvenance,sbomBundle:$gameSbom},web:{provenanceBundle:$webProvenance,sbomBundle:$webSbom}}' \
            "$security_evidence" >"${security_evidence}.tmp"
          mv -f "${security_evidence}.tmp" "$security_evidence"
      - name: Upload verified image pair evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: munchkin-images-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy production
    needs: publish
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.publish.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-production.yml
    with:
      game_image: ${{ needs.publish.outputs.game_image }}
      web_image: ${{ needs.publish.outputs.web_image }}
      commit: ${{ github.sha }}
      release_run_id: ${{ github.run_id }}
    secrets: inherit
