name: deploy-production

on:
  workflow_call:
    inputs:
      game_image:
        description: Immutable game image reference
        required: true
        type: string
      web_image:
        description: Immutable web image reference
        required: true
        type: string
      commit:
        description: Full lowercase commit SHA represented by the images
        required: true
        type: string
      release_run_id:
        description: Successful CI run that produced the image, SBOM and attestation evidence
        required: true
        type: string
  workflow_dispatch:
    inputs:
      game_image:
        description: Immutable game image reference
        required: true
        type: string
      web_image:
        description: Immutable web image reference
        required: true
        type: string
      commit:
        description: Full lowercase commit SHA represented by the images
        required: true
        type: string
      release_run_id:
        description: Successful CI run that produced the image, SBOM and attestation evidence
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-deploy
    env:
      GAME_IMAGE: ${{ inputs.game_image }}
      WEB_IMAGE: ${{ inputs.web_image }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_USER: munchkin-deploy
      DEPLOY_PORT: "2222"
    steps:
      - name: Checkout release verification contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Validate immutable release inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GAME_IMAGE" =~ ^cr\.yandex/crpdnmjudj1usiu90gdn/game@sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_IMAGE" =~ ^cr\.yandex/crpdnmjudj1usiu90gdn/web@sha256:[0-9a-f]{64}$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ -n "$DEPLOY_HOST" && "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" == "2222" ]]

      - name: Install pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Verify release SBOM and keyless attestation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          evidence_dir="$RUNNER_TEMP/munchkin-release-evidence"
          rm -rf -- "$evidence_dir"
          mkdir -p -- "$evidence_dir"
          gh run download "$RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "munchkin-images-${RELEASE_COMMIT}" \
            --dir "$evidence_dir"
          manifest="$(find "$evidence_dir" -type f -name "munchkin-images-${RELEASE_COMMIT}.json" -print -quit)"
          security_evidence="$(find "$evidence_dir" -type f -name "security-evidence-${RELEASE_COMMIT}.json" -print -quit)"
          [[ -n "$manifest" && -n "$security_evidence" ]]
          jq -e --arg run "$RELEASE_RUN_ID" '.workflowRunId == $run' "$manifest" >/dev/null
          bash scripts/production/verify-release-evidence.sh \
            --game-image "$GAME_IMAGE" \
            --web-image "$WEB_IMAGE" \
            --commit "$RELEASE_COMMIT" \
            --release-manifest "$manifest" \
            --security-evidence "$security_evidence" \
            --github-repo "$GITHUB_REPOSITORY" \
            --require-attestation

      - name: Prepare protected SSH material
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_PRIVATE_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          key_path="$(mktemp "$RUNNER_TEMP/munchkin-deploy-key.XXXXXX")"
          known_hosts_path="$(mktemp "$RUNNER_TEMP/munchkin-known-hosts.XXXXXX")"
          chmod 0600 "$key_path" "$known_hosts_path"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" >"$key_path"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$known_hosts_path"
          ssh-keygen -y -f "$key_path" >/dev/null
          {
            printf 'DEPLOY_SSH_KEY_PATH=%s\n' "$key_path"
            printf 'DEPLOY_KNOWN_HOSTS_PATH=%s\n' "$known_hosts_path"
          } >>"$GITHUB_ENV"

      - name: Deploy through forced-command SSH boundary
        id: remote-deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$DEPLOY_SSH_KEY_PATH" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias="$DEPLOY_HOST" \
            -o UserKnownHostsFile="$DEPLOY_KNOWN_HOSTS_PATH" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            deploy --game-image "$GAME_IMAGE" --web-image "$WEB_IMAGE" \
            --commit "$RELEASE_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          deploy_exit=$?
          set -e
          ssh -i "$DEPLOY_SSH_KEY_PATH" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias="$DEPLOY_HOST" \
            -o UserKnownHostsFile="$DEPLOY_KNOWN_HOSTS_PATH" \
            "$DEPLOY_USER@$DEPLOY_HOST" status --evidence \
            >"$RUNNER_TEMP/production-release-evidence.json" || true
          exit "$deploy_exit"

      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-release-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove protected SSH material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -z "${DEPLOY_SSH_KEY_PATH:-}" || ! -e "$DEPLOY_SSH_KEY_PATH" ]] || rm -f -- "$DEPLOY_SSH_KEY_PATH"
          [[ -z "${DEPLOY_KNOWN_HOSTS_PATH:-}" || ! -e "$DEPLOY_KNOWN_HOSTS_PATH" ]] || rm -f -- "$DEPLOY_KNOWN_HOSTS_PATH"
