name: Munchkin security and supply chain

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: munchkin-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-pins:
    name: Full-SHA action and workflow policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Verify workflow pins
        run: node scripts/ci/verify-action-pins.mjs

  scanners:
    name: Pinned repository security scanners
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.25.1
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Run pinned scanner stack
        run: |
          chmod +x scripts/ci/security-scan.sh
          scripts/ci/security-scan.sh \
            --output-dir security-evidence \
            --release-commit "$GITHUB_SHA"
      - name: Upload scanner evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-evidence-${{ github.sha }}
          path: security-evidence
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL Go and JavaScript/TypeScript
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@c54b30b7df092240050e69945842bc67aee0f0f4
      - name: Analyze
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4
        with:
          category: "/language:${{ matrix.language }}"
